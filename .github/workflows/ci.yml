name: CI

on:
  push:
    branches: [main, "ai/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: .NET services
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # school-service migration tests create and drop their own databases here
      SCHOOL_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            tests: backend/services/api-gateway/ApiGateway.Tests
          - name: auth
            tests: backend/services/auth-service/AuthService/AuthService.Tests
          - name: school
            tests: backend/services/school-service/SchoolService/SchoolService.Tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test ${{ matrix.name }}
        run: dotnet test ${{ matrix.tests }} --configuration Release

  migrations:
    name: EF model matches migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool install --global dotnet-ef --version 10.0.*
      - name: auth-service
        working-directory: backend/services/auth-service/AuthService
        run: dotnet ef migrations has-pending-model-changes --project AuthService.Infrastructure --startup-project AuthService.API
      - name: school-service
        working-directory: backend/services/school-service/SchoolService
        run: dotnet ef migrations has-pending-model-changes --project SchoolService.Infrastructure --startup-project SchoolService.API

  admin-web:
    name: admin-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
