services:
  consul:
    container_name: consul_server
    image: hashicorp/consul:1.22.7
    restart: unless-stopped
    ports: 
      - "8500:8500"
      - "8600:8600/udp"
    environment:
      CONSUL_BIND_INTERFACE: eth0
    command: agent -server -ui -bootstrap-expect=1 -client=0.0.0.0
    volumes:
      - consul_data:/consul/data
    networks:
      - school_network

  api-gateway:
    container_name: api_gateway
    restart: unless-stopped
    build:
      context: ./services/api-gateway/ApiGateway
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
    depends_on:
      - auth-service
      - school-service
      - consul
    networks:
      - school_network

  auth-service:
    container_name: auth_service
    restart: unless-stopped
    build:
      context: ./services/auth-service/AuthService
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__AuthDb: Host=auth-db;Port=5432;Database=auth_db;Username=auth_user;Password=auth_pass
      EmailSettings__FromEmail: ${EMAILSETTINGS_FROM_EMAIL}
      EmailSettings__SmtpUser: ${EMAILSETTINGS_SMTP_USER}
      EmailSettings__AppPassword: ${EMAILSETTINGS_APP_PASSWORD}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: AuthService
      Jwt__Audience: AuthServiceClients
    depends_on:
      - auth-db
      - consul
    networks:
      - school_network

  auth-db:
    container_name: auth_db
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - school_network

  pgadmin:
    container_name: pgadmin_container
    restart: unless-stopped
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - auth-db
      - school-db
    networks:
      - school_network

  school-service:
    container_name: school_service
    restart: unless-stopped
    build:
      context: ./services/school-service/SchoolService
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__SchoolDb: Host=school-db;Port=5432;Database=school_db;Username=school_user;Password=school_pass
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: AuthService
      Jwt__Audience: AuthServiceClients
    depends_on:
      - school-db
      - consul
    networks:
      - school_network

  school-db:
    container_name: school_db
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_DB: school_db
      POSTGRES_USER: school_user
      POSTGRES_PASSWORD: school_pass
    ports:
      - "5434:5432"
    volumes:
      - school_db_data:/var/lib/postgresql/data
    networks:
      - school_network

  admin-web:
    container_name: admin_web
    restart: unless-stopped
    build:
      context: ../admin-web
      args:
        API_URL: "http://api-gateway:8080"
    ports:
      - "3000:3000"
    environment:
      API_URL: "http://api-gateway:8080"
    depends_on:
      - api-gateway
    networks:
      - school_network

  # Flutter app built for the web; its nginx proxies /api to the gateway
  web-app:
    container_name: web_app
    restart: unless-stopped
    build:
      context: ../frontend
    ports:
      - "3200:80"
    depends_on:
      - api-gateway
    networks:
      - school_network

volumes:
  auth_db_data:
  school_db_data:
  consul_data:

networks:
  school_network:
    driver: bridge
